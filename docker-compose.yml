services:
  backend:
    build: ./backend
    container_name: venue-backend
    restart: unless-stopped
    environment:
      # SQLite 数据库文件位置（挂载持久化卷）
      DB_PATH: /app/data/venue.db
      GUNICORN_WORKERS: "2"
    volumes:
      - venue-data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: venue-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 宿主机端口:容器端口；可通过环境变量 WEB_PORT 修改
      - "${WEB_PORT:-8080}:80"

volumes:
  venue-data:
